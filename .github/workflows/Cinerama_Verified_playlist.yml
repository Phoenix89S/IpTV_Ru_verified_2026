name: Update CINERAMA Verified Playlist

on:
  schedule:
    # Каждый день в 03:00 UTC
    - cron: '0 3 * * *'

  # Ручной запуск
  workflow_dispatch:

  # Запуск при изменении скрипта или workflow
  push:
    paths:
      - 'Cinerama_verified.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Generate and push playlist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Download Cinerama_verified.py
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/Phoenix89S/IpTV_Ru_verified_2026/main/Cinerama_verified.py" \
            -o Cinerama_verified.py

      - name: Run playlist generator
        run: |
          python Cinerama_verified.py

      - name: Check for changes
        id: git_status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet CINERAMA_VERIFIED.m3u; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Файл не изменился, коммит не требуется."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Файл изменился, готовим коммит."
          fi

      - name: Commit and Push changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git add CINERAMA_VERIFIED.m3u

          COMMIT_MSG="chore: update CINERAMA_VERIFIED.m3u ($(date +'%Y-%m-%d'))"

          git commit -m "$COMMIT_MSG"

          git push origin HEAD:${{ github.ref_name }}