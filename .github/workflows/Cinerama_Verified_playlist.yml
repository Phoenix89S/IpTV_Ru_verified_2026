name: Update CINERAMA Verified Playlist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'Cinerama_verified.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Generate and push playlist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run playlist generator
        run: |
          python Cinerama_verified.py

      - name: Check for changes
        id: git_status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet CINERAMA_VERIFIED.m3u; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git add CINERAMA_VERIFIED.m3u
          git commit -m "chore: update CINERAMA_VERIFIED.m3u ($(date +'%Y-%m-%d')) © Phoenix 89S"
          git push