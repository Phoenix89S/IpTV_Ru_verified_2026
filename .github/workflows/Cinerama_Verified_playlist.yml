name: Update CINERAMA Verified Playlist

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'Cinerama_verified.py'
      - '.github/workflows/Cinerama_Verified_playlist.yml'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Generate Verified 1 playlist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Verified 1 playlist generator
        run: |
          python Cinerama_verified.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CINERAMA_VERIFIED_1_OUTPUTS
          path: |
            cinerama_Verified_1.m3u
            SKALA_DREG_REPORT.txt

      - name: Check for changes
        id: git_status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code --quiet || git status --porcelain | grep -E '(cinerama_Verified_1.m3u|SKALA_DREG_REPORT.txt)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git add cinerama_Verified_1.m3u SKALA_DREG_REPORT.txt
          git commit -m "chore: update cinerama_Verified_1.m3u & SKALA_DREG_REPORT.txt ($(date +'%Y-%m-%d %H:%M:%S')) © Phoenix 89S"
          git push origin ${{ github.ref_name }}